<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turbo Racer — Full Stack</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1424;color:#f0f6ff;font:16px system-ui,sans-serif;text-align:center}h1{color:#5ff0ca;margin:18px 0 8px}.wrap{display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap;padding:12px}.game{position:relative;width:360px;height:550px;overflow:hidden;background:#3b404b;border:8px solid #317755;border-radius:12px}.line{position:absolute;top:-100%;height:300%;width:5px;background:repeating-linear-gradient(to bottom,#fff 0 60px,transparent 60px 110px);opacity:.8}.line.a{left:33%}.line.b{left:66%}.moving .line{animation:road .65s linear infinite}@keyframes road{to{transform:translateY(110px)}}.car{position:absolute;width:52px;height:90px;border-radius:13px 13px 10px 10px;border:3px solid #172536;box-shadow:inset 0 0 0 4px #ffffff30,0 5px 9px #0009}.car:before{content:'';position:absolute;top:16px;left:9px;right:9px;height:20px;border-radius:6px;background:#102940;border:2px solid #b7d7f3}.car:after{content:'';position:absolute;bottom:12px;left:9px;right:9px;height:14px;border-radius:5px;background:#102940;border:2px solid #b7d7f3}.player{bottom:20px;background:#22d7b6}.enemy{background:#f65b6d}.panel{background:#19283f;padding:20px;border-radius:15px;width:290px;text-align:left}.panel h2{margin-top:0;color:#5ff0ca}button{padding:11px 17px;border:0;border-radius:9px;background:#5ff0ca;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}input{padding:10px;width:100%;border-radius:8px;border:1px solid #7487a5;margin-bottom:10px}ol{padding-left:25px}li{padding:5px}#message{min-height:25px;color:#fbdc81}.controls{margin:12px}small{color:#bdc9d9}
</style></head><body><h1>🏎️ TURBO RACER</h1><div>Score: <strong id="score">0</strong> | Level: <strong id="level">1</strong></div><div class="wrap"><div><div class="game" id="game"><div class="line a"></div><div class="line b"></div><div class="car player" id="player"></div></div><div class="controls"><button id="left">◀ Left</button> <button id="right">Right ▶</button></div><small>Use ← → or A / D to dodge traffic</small></div><aside class="panel"><h2>Play & Save</h2><label>Your name</label><input id="name" maxlength="24" value="Player"><button id="start">Start Race</button><p id="message">Press Start Race!</p><h2>🏆 Leaderboard</h2><ol id="scores"><li>Loading...</li></ol><button id="refresh">Refresh Scores</button><p><small>Frontend: HTML/CSS/JS<br>Backend: Python Flask<br>Database: SQLite<br>Docker: 2 containers</small></p></aside></div><script>
const game=document.querySelector('#game'),player=document.querySelector('#player'),scoreEl=document.querySelector('#score'),levelEl=document.querySelector('#level'),msg=document.querySelector('#message');let lane=1,playing=false,score=0,enemies=[],last=0,spawn=0,raf=0;
function x(l){return (l+.5)*game.clientWidth/3-26}function drawPlayer(){player.style.left=x(lane)+'px'}drawPlayer();function move(d){if(playing){lane=Math.max(0,Math.min(2,lane+d));drawPlayer()}}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key)){e.preventDefault();if(!e.repeat)move(['ArrowLeft','a','A'].includes(e.key)?-1:1)}});document.querySelector('#left').onclick=()=>move(-1);document.querySelector('#right').onclick=()=>move(1);
async function leaderboard(){try{let r=await fetch('/api/scores');if(!r.ok)throw Error('API unavailable');let data=await r.json();document.querySelector('#scores').innerHTML=data.length?data.map(s=>`<li>${escapeHtml(s.name)} — ${s.score}</li>`).join(''):'<li>No scores yet</li>'}catch(e){document.querySelector('#scores').textContent='Backend unavailable'}}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelector('#refresh').onclick=leaderboard;
function addEnemy(){let l=Math.floor(Math.random()*3),el=document.createElement('div');el.className='car enemy';el.style.left=x(l)+'px';el.style.top='-100px';game.appendChild(el);enemies.push({l,y:-100,el})}
async function finish(){playing=false;game.classList.remove('moving');document.querySelector('#start').disabled=false;msg.textContent=`Crash! Final score: ${score}. Saving...`;try{let r=await fetch('/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#name').value,score})});if(!r.ok)throw Error('Save failed');msg.textContent=`Game over! Score ${score} saved!`;await leaderboard()}catch(e){msg.textContent=`Game over! Score ${score}. Could not save (backend unavailable).`}}
function tick(t){if(!playing)return;let dt=Math.min((t-last)/1000,.05);last=t;let level=1+Math.floor(score/100);levelEl.textContent=level;spawn+=dt;if(spawn>Math.max(.65,1.35-level*.06)){spawn=0;addEnemy()}let top=game.clientHeight-20-90;for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.y+=(220+level*30)*dt;e.el.style.top=e.y+'px';if(e.l===lane&&e.y+78>top+12&&e.y+12<top+78){finish();return}if(e.y>game.clientHeight){e.el.remove();enemies.splice(i,1);score+=10;scoreEl.textContent=score}}raf=requestAnimationFrame(tick)}
function start(){cancelAnimationFrame(raf);enemies.forEach(e=>e.el.remove());enemies=[];score=0;spawn=0;lane=1;scoreEl.textContent=0;levelEl.textContent=1;drawPlayer();playing=true;last=performance.now();game.classList.add('moving');msg.textContent='Avoid the red cars!';document.querySelector('#start').disabled=true;raf=requestAnimationFrame(tick)}document.querySelector('#start').onclick=start;leaderboard();
</script></body></html>
